<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <title>미세미세 - 비주얼 에디션</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: 'Pretendard', sans-serif;
            display: flex; justify-content: center;
            min-height: 100vh; color: white;
            transition: background-color 1s ease;
            background-color: #34495e;
        }
        /* 배경 애니메이션용 캔버스 */
        #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        #app { width: 100%; max-width: 400px; text-align: center; padding: 30px 20px; z-index: 1; }
        .search-container {
            display: flex; background: rgba(255, 255, 255, 0.15);
            border-radius: 50px; padding: 5px 15px; margin-bottom: 25px;
            backdrop-filter: blur(5px);
        }
        .search-container input { background: none; border: none; color: white; flex: 1; padding: 8px; outline: none; }
        .search-container button { background: none; border: none; color: white; cursor: pointer; }

        .location { font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; }
        #face { font-size: 7rem; margin: 15px 0; display: block; }
        #dust-score { font-size: 5rem; font-weight: 800; margin: 0; }
        .message {
            font-size: 1.1rem; font-weight: 600; margin: 20px 0;
            background: rgba(255, 255, 255, 0.2); padding: 10px 25px; border-radius: 50px;
        }
        .detail-container { display: flex; justify-content: space-between; gap: 10px; }
        .detail-card { background: rgba(0, 0, 0, 0.1); padding: 12px 5px; border-radius: 15px; flex: 1; font-size: 0.8rem; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <main id="app">
        <div class="search-container">
            <input type="text" id="station-input" placeholder="동네 이름 입력 (예: 구리)">
            <button onclick="handleSearch()">🔍</button>
        </div>
        <div class="location" id="addr">위치 찾는 중...</div>
        <div id="face">⏳</div>
        <h1 id="dust-score">--</h1>
        <div class="message" id="msg">데이터 로딩 중</div>
        <div class="detail-container">
            <div class="detail-card">초미세<br><span id="pm25-val">--</span></div>
            <div class="detail-card">오존<br><span id="o3-val">--</span></div>
            <div class="detail-card">이산화질소<br><span id="no2-val">--</span></div>
        </div>
    </main>

    <script>
        const myKey = "c3dcccf62d4f155a01b790cd8273d88f58cb591332328e0a373544387dfb24ce";
        const PROXY = "https://api.allorigins.win/get?url=";
        
        // --- 애니메이션 엔진 ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let particleCount = 50;
        let particleColor = "white";

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = particleColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        initParticles();
        animate();

        // --- 데이터 로직 ---
        function initApp() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(success, error, { timeout: 5000 });
            } else { getDustData("종로구"); }
        }

        function handleSearch() {
            const input = document.getElementById('station-input').value.trim();
            if (input) getDustData(input);
        }

        function success(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const tmX = (lon - 127.0) * 91397 + 200000;
            const tmY = (lat - 38.0) * 110941 + 600000;
            const url = `http://apis.data.go.kr/B552584/MsrstnInfoInqireSvc/getNearbyMsrstnList?serviceKey=${myKey}&returnType=json&tmX=${tmX}&tmY=${tmY}&ver=1.1`;
            fetch(PROXY + encodeURIComponent(url)).then(res => res.json()).then(wrapper => {
                const data = JSON.parse(wrapper.contents);
                const items = data.response.body.items;
                getDustData((items && items.length > 0) ? items[0].stationName : "종로구");
            });
        }

        function error() { getDustData("종로구"); }

        function getDustData(station) {
            const url = `http://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getMsrstnAcctoRltmMesureDnsty?serviceKey=${myKey}&returnType=json&numOfRows=1&stationName=${encodeURI(station)}&dataTerm=DAILY&ver=1.0`;
            fetch(PROXY + encodeURIComponent(url)).then(res => res.json()).then(wrapper => {
                const data = JSON.parse(wrapper.contents);
                const items = data.response.body.items;
                if (items && items.length > 0) updateUI(station, items[0]);
            });
        }

        function updateUI(station, item) {
            const val = parseInt(item.pm10Value) || 0;
            let color, face, msg;

            if (val <= 30) { 
                color = "#2ecc71"; face = "😊"; msg = "맑음"; 
                particleCount = 30; particleColor = "rgba(255,255,255,0.5)"; // 반짝이는 효과
            } else if (val <= 80) { 
                color = "#f1c40f"; face = "🙂"; msg = "보통"; 
                particleCount = 60; particleColor = "rgba(255,255,255,0.3)";
            } else { 
                color = "#e67e22"; face = "😷"; msg = "나쁨"; 
                particleCount = 150; particleColor = "rgba(100,100,100,0.4)"; // 먼지 효과
            }

            document.body.style.backgroundColor = color;
            document.getElementById('addr').innerText = station + " 측정소";
            document.getElementById('face').innerText = face;
            document.getElementById('dust-score').innerText = val + "㎍/㎥";
            document.getElementById('msg').innerText = `공기가 ${msg}!`;
            document.getElementById('pm25-val').innerText = (item.pm25Value || "-") + "㎍/㎥";
            document.getElementById('o3-val').innerText = (item.o3Value || "-") + "ppm";
            document.getElementById('no2-val').innerText = (item.no2Value || "-") + "ppm";
            initParticles(); // 애니메이션 상태 갱신
        }

        initApp();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAn0lEQVQ4T2P8////fwYgYCSIsQC1DKMB">
    <title>내 손안의 미세미세 - 프로 에디션</title>
    <style>
        :root { --main-bg: #34495e; }
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', sans-serif;
            display: flex; justify-content: center;
            min-height: 100vh;
            transition: background-color 0.8s ease;
            color: white; background-color: var(--main-bg);
        }
        #app { width: 100%; max-width: 400px; text-align: center; padding: 30px 20px; box-sizing: border-box; }
        
        /* 검색창 스타일 */
        .search-box {
            display: flex; gap: 8px; margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px; border-radius: 50px;
        }
        .search-box input {
            background: none; border: none; color: white; flex: 1;
            outline: none; font-size: 1rem;
        }
        .search-box input::placeholder { color: rgba(255, 255, 255, 0.6); }
        .search-box button {
            background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem;
        }

        .location { font-size: 1.2rem; font-weight: 600; margin-bottom: 5px; }
        .update-time { font-size: 0.8rem; opacity: 0.6; margin-bottom: 20px; }
        #face { font-size: 7rem; display: block; margin: 15px 0; animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        #dust-score { font-size: 5.5rem; font-weight: 800; margin: 0; }
        .unit { font-size: 1.2rem; font-weight: 300; }
        .message {
            font-size: 1.1rem; font-weight: 600; margin: 20px 0;
            background: rgba(255, 255, 255, 0.25);
            padding: 10px 25px; border-radius: 50px; display: inline-block;
        }
        .detail-container { display: flex; justify-content: space-between; gap: 10px; }
        .detail-card {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
            padding: 12px 5px; border-radius: 15px; flex: 1;
        }
        .detail-card .label { display: block; font-size: 0.7rem; opacity: 0.8; margin-bottom: 4px; }
        .detail-card .val { font-size: 0.9rem; font-weight: 700; }
    </style>
</head>
<body>

    <main id="app">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="동네 이름을 입력하세요 (예: 구리시)">
            <button onclick="searchStation()">🔍</button>
        </div>

        <div class="location" id="addr">위치 찾는 중...</div>
        <div class="update-time" id="last-update">-</div>
        <div id="face">⏳</div>
        <h1 id="dust-score">--<span class="unit">㎍/㎥</span></h1>
        <div class="message" id="msg">잠시만 기다려주세요</div>

        <div class="detail-container">
            <div class="detail-card"><span class="label">초미세먼지</span><span class="val" id="pm25-val">--</span></div>
            <div class="detail-card"><span class="label">오존</span><span class="val" id="o3-val">--</span></div>
            <div class="detail-card"><span class="label">이산화질소</span><span class="val" id="no2-val">--</span></div>
        </div>
    </main>

    <script>
        const myKey = "c3dcccf62d4f155a01b790cd8273d88f58cb591332328e0a373544387dfb24ce";
        const PROXY = "https://api.allorigins.win/get?url=";

        function initApp() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(success, error, {
                    enableHighAccuracy: true, // 정확도 향상 옵션
                    timeout: 5000
                });
            } else { getDustData("종로구"); }
        }

        // 검색 기능 추가
        function searchStation() {
            const input = document.getElementById('search-input').value.trim();
            if(input) {
                document.getElementById('addr').innerText = "검색 중...";
                getDustData(input);
            }
        }

        // 엔터키 검색 지원
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') searchStation();
        });

        function success(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            // 보정된 정밀 좌표 변환 (중부원점 기준)
            const tmX = (lon - 127.0) * 91397 + 200000;
            const tmY = (lat - 38.0) * 110941 + 600000;

            const url = `http://apis.data.go.kr/B552584/MsrstnInfoInqireSvc/getNearbyMsrstnList?serviceKey=${myKey}&returnType=json&tmX=${tmX}&tmY=${tmY}&ver=1.1`;
            
            fetch(PROXY + encodeURIComponent(url))
                .then(res => res.json())
                .then(wrapper => {
                    const data = JSON.parse(wrapper.contents);
                    const items = data.response.body.items;
                    const station = (items && items.length > 0) ? items[0].stationName : "종로구";
                    getDustData(station);
                }).catch(() => getDustData("종로구"));
        }

        function error() { getDustData("종로구"); }

        function getDustData(station) {
            // [수정 완료] 오타 제거된 정확한 기능명 사용
            const url = `http://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getMsrstnAcctoRltmMesureDnsty?serviceKey=${myKey}&returnType=json&numOfRows=1&stationName=${encodeURI(station)}&dataTerm=DAILY&ver=1.0`;
            
            fetch(PROXY + encodeURIComponent(url))
                .then(res => res.json())
                .then(wrapper => {
                    const data = JSON.parse(wrapper.contents);
                    const items = data.response.body.items;
                    if (items && items.length > 0) {
                        updateUI(station, items[0]);
                    } else {
                        alert("해당 지역의 데이터를 찾을 수 없습니다.");
                        document.getElementById('addr').innerText = "지역 확인 필요";
                    }
                }).catch(err => console.error(err));
        }

        function updateUI(station, item) {
            const val = parseInt(item.pm10Value) || 0;
            let color = "#3498db", face = "😊", msg = "공기가 좋아요!";
            
            if(val > 150) { color = "#e74c3c"; face = "😫"; msg = "절대 나가지 마세요!"; }
            else if(val > 80) { color = "#f39c12"; face = "😐"; msg = "마스크 꼭 쓰세요!"; }
            else if(val > 30) { color = "#2ecc71"; face = "🙂"; msg = "보통이에요"; }

            document.body.style.backgroundColor = color;
            document.getElementById('addr').innerText = station + " 측정소";
            document.getElementById('last-update').innerText = "업데이트: " + (item.dataTime || "-");
            document.getElementById('face').innerText = face;
            document.getElementById('dust-score').innerHTML = `${val}<span class="unit">㎍/㎥</span>`;
            document.getElementById('msg').innerText = msg;
            document.getElementById('pm25-val').innerText = (item.pm25Value || "-") + "㎍/㎥";
            document.getElementById('o3-val').innerText = (item.o3Value || "-") + "ppm";
            document.getElementById('no2-val').innerText = (item.no2Value || "-") + "ppm";
        }

        initApp();
    </script>
</body>
</html>
